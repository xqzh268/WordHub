name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    # 兜底：任何步骤卡住也不会占满默认的 6 小时
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:schema
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:m2:faux
      - run: npm run test:m1:store
      - run: npm run build:desktop
      - run: npm run test:desktop
        timeout-minutes: 8
      - run: npm run test:layout
        timeout-minutes: 8
      - run: npm run test:m1:e2e
        timeout-minutes: 8
      - run: npm run test:chapters:e2e
        timeout-minutes: 8
      - run: npm run test:facts:e2e
        timeout-minutes: 8
      - run: npm run test:providers:e2e
        timeout-minutes: 8
      - run: npm run test:paper:e2e
        timeout-minutes: 8
      - run: npm run test:export:e2e
        timeout-minutes: 8
      - run: npm run test:agent:e2e
        timeout-minutes: 8
      - run: npm run test:references:e2e
        timeout-minutes: 8
      - run: npm run test:graph:e2e
        timeout-minutes: 8

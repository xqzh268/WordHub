name: M3 live regression

on:
  workflow_dispatch:

concurrency:
  group: m3-live-regression
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - run: npm run test:m3:live
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WORDHUB_REQUIRE_LIVE: "1"
